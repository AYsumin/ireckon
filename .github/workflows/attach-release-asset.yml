name: attach-release-asset

# 为什么要有这个：
#   2026-11-01 他这台机器上传 release 附件一直失败（uploads.github.com 被本地加速代理拦截，
#   换 IP、换文件名、换 zip/tar.gz、刷新重试都不成）。
#   所以把"打 zip 并挂到 release"这件事交给 GitHub 自己的机器去做 —— 一次配好，以后每次发布都自动有附件。

on:
  release:
    types: [published]      # 每次发布新 release 自动跑
  workflow_dispatch:        # 也可以手动跑（给已经发过的那条补附件）
    inputs:
      tag:
        description: '要补附件的 tag（例如 v0.2.9）'
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: 打包（压缩包里不带 .git）
        id: pack
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          NAME="IReckon-${TAG#v}.zip"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          git archive --format=zip -o "/tmp/pkg/$NAME" HEAD
          ls -l "/tmp/pkg/$NAME"

      - name: 挂到 release（已存在同名附件则先删）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.pack.outputs.tag }}"
          NAME="${{ steps.pack.outputs.name }}"
          gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null
          # 同名附件先删掉，避免重复
          EXISTING=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq ".assets[] | select(.name==\"$NAME\") | .name" || true)
          if [ -n "$EXISTING" ]; then
            gh release delete-asset "$TAG" "$NAME" --repo "${{ github.repository }}" --yes || true
          fi
          gh release upload "$TAG" "/tmp/pkg/$NAME" --repo "${{ github.repository }}"

      - name: 把大小与哈希写进任务摘要
        run: |
          NAME="${{ steps.pack.outputs.name }}"
          echo "### 附件已挂上：$NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l "/tmp/pkg/$NAME" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "/tmp/pkg/$NAME" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
